<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลาทำงานพนักงาน (Cloud Database)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontPrompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">⏱️</span>
            <h1 class="text-xl font-bold">ระบบลงเวลาทำงาน (Victoria Gardens)</h1>
        </div>
        <div class="flex items-center space-x-3">
            <span id="cloud-status" class="text-xs bg-green-500 px-2 py-1 rounded-full text-white">🟢 Cloud Connected</span>
            <button onclick="toggleJ9Mode()" id="j9-btn" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">J9MODE</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- ฝั่งซ้าย: สแกน QR / ตอกบัตร -->
        <div class="md:col-span-2 bg-white rounded-2xl shadow-md p-6 flex flex-col">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>📷</span> สแกนคิวอาร์โค้ดลงเวลา
            </h2>
            
            <div id="reader" class="w-full bg-gray-900 rounded-xl overflow-hidden mb-4 min-h-[250px] flex items-center justify-center text-white">
                <p class="text-sm text-gray-400">กำลังเปิดกล้องสแกน...</p>
            </div>

            <div class="flex gap-3 mb-6">
                <input type="text" id="manual-code" placeholder="หรือกรอกรหัสพนักงาน..." class="flex-1 border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500">
                <button onclick="handlePunch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-medium transition shadow">บันทึกเวลา</button>
            </div>

            <div class="border-t pt-4 mt-auto">
                <h3 class="text-sm font-semibold text-gray-600 mb-2">📌 รายการบันทึกสแกนล่าสุดวันนี้ (Cloud Sync)</h3>
                <div id="log-list" class="space-y-2 max-h-48 overflow-y-auto text-sm text-gray-700">
                    <p class="text-gray-400 text-center py-4">ยังไม่มีประวัติการสแกนในวันนี้</p>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: รายชื่อพนักงาน / ข้อมูลด่วน -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex flex-col">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>👥</span> พนักงานในระบบ
            </h2>
            <div id="employee-list" class="space-y-3 flex-1 overflow-y-auto max-h-[400px]">
                <!-- รายการพนักงานจำลอง -->
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border">
                    <div>
                        <p class="font-semibold text-gray-800">Nuttun Churod</p>
                        <p class="text-xs text-gray-500">รหัส: 00001 (Store Manager)</p>
                    </div>
                    <span class="w-3 h-3 rounded-full bg-green-500"></span>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/com.firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/com.firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBnGrddLA9n4xnXJ9s4kG4Ph1LId9z-5f4",
          authDomain: "time-recorder-ae284.firebaseapp.com",
          projectId: "time-recorder-ae284",
          storageBucket: "time-recorder-ae284.firebasestorage.app",
          messagingSenderId: "559370263290",
          appId: "1:559370263290:web:43add0455d1222bf1b8743",
          measurementId: "G-V28LB3FW7Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handlePunch = async function() {
            const codeInput = document.getElementById('manual-code');
            const code = codeInput.value.trim();
            if(!code) {
                alert('กรุณากรอกหรือสแกนรหัสพนักงาน');
                return;
            }

            try {
                await addDoc(collection(db, "time_logs"), {
                    employeeId: code,
                    timestamp: new Date().toLocaleTimeString('th-TH'),
                    date: new Date().toLocaleDateString('th-TH'),
                    createdAt: serverTimestamp()
                });
                alert('บันทึกเวลาสำเร็จ (ซิงค์เข้า Cloud แล้ว)!');
                codeInput.value = '';
                loadLogs();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            }
        }

        async function loadLogs() {
            try {
                const querySnapshot = await getDocs(collection(db, "time_logs"));
                const logList = document.getElementById('log-list');
                logList.innerHTML = '';
                
                if(querySnapshot.empty) {
                    logList.innerHTML = '<p class="text-gray-400 text-center py-4">ยังไม่มีประวัติการสแกนในวันนี้</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    logList.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border text-xs">
                            <span class="font-semibold">รหัส: ${data.employeeId}</span>
                            <span class="text-blue-600 font-medium">${data.timestamp}</span>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error loading logs: ", e);
            }
        }

        window.toggleJ9Mode = function() {
            const pin = prompt("กรุณากรอก PIN สำหรับเข้า J9MODE (ค่าเริ่มต้น: 1234):");
            if(pin === "1234") {
                alert("ยินดีต้อนรับสู่ J9MODE (โหมดผู้จัดการ)");
            } else if(pin !== null) {
                alert("PIN ไม่ถูกต้อง");
            }
        }

        // โหลดข้อมูลตอนเปิดเว็บ
        loadLogs();
    </script>
</body>
</html>
